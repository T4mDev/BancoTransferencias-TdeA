# Perfil "h2": base de datos en memoria, no requiere instalar PostgreSQL.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Los datos se pierden al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:banktdea;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

