spring.application.name=banktransfer

# PostgreSQL datasource (se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banktdea}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS: origen permitido para el frontend
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

# Carga de cuentas de ejemplo cuando la base de datos está vacía
app.seed-data=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
